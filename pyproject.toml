[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abm-geometry"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]>=0.4.25",
    "chex>=0.1.86",
    "jaxtyping>=0.2.28",
    "optax>=0.2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "omegaconf>=2.3",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abm_geometry"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyright>=1.1",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
